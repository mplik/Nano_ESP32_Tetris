<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Nano ESP32</title>
    <meta name="description" content="Nano ESP32 Tetris — interfejs WWW sterowania grą.">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/Game_Boy_faficon.png?v=1">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/Game_Boy_faficon_16.png?v=1">
    <link rel="shortcut icon" type="image/png" href="/assets/images/Game_Boy_faficon.png?v=1">
    <link rel="apple-touch-icon" href="/assets/images/Game_Boy_faf.png?v=1">
    <link rel="manifest" href="/site.webmanifest?v=1">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Sterowanie Tetrisem</h1>
        <p class="status">Status: Połaczono z ESP32</p>

        <section class="project-section">
            <h2>Opis projektu</h2>
            <p>To jest prosty projekt Tetrisa obsługiwany przez ESP32. Poniżej możesz odkryć grafikę z finezją.</p>

            <div class="reveal-controls">
                <label class="switch" for="imageToggle">
                    <input type="checkbox" id="imageToggle" checked>
                    <span class="slider"></span>
                    <span class="switch-text">Pokaż grafikę</span>
                </label>
                <button type="button" class="reveal-button" id="revealButton">Pokaż detal</button>
            </div>

            <div class="reveal-card is-visible" id="imageRevealCard" aria-hidden="false">
                <img src="/assets/images/Tetris_ESP32.WEBP" alt="Grafika projektu Nano ESP32 Tetris" class="project-image">
            </div>
        </section>

        <button id="startButton">Start Game</button>

        <div class="pad">
            <button id="btn-left" class="btn">LEWO</button>
            <button id="btn-rotate" class="btn">OBROT</button>
            <button id="btn-right" class="btn">PRAWO</button>
            <button id="btn-drop" class="btn vide">SZYBKI SPADEK</button>
        </div>
    </div>
    <script>
        const toggle = document.getElementById('imageToggle');
        const button = document.getElementById('revealButton');
        const revealCard = document.getElementById('imageRevealCard');

        function setReveal(visible) {
            toggle.checked = visible;
            revealCard.classList.toggle('is-visible', visible);
            revealCard.setAttribute('aria-hidden', String(!visible));
        }

        button.addEventListener('click', () => setReveal(!toggle.checked));
        toggle.addEventListener('change', () => setReveal(toggle.checked));

        setReveal(true);

        // --- Web control: send command to ESP32 ---
        function sendCommand(cmd) {
            fetch('/action?go=' + encodeURIComponent(cmd), { method: 'GET' })
                .then(resp => {
                    if (!resp.ok) console.warn('Server response', resp.status);
                })
                .catch(err => console.error('Fetch error:', err));
        }

        // Attach handlers to control buttons
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnRotate = document.getElementById('btn-rotate');
        const btnDrop = document.getElementById('btn-drop');

        if (btnLeft) btnLeft.addEventListener('click', () => sendCommand('left'));
        if (btnRight) btnRight.addEventListener('click', () => sendCommand('right'));
        if (btnRotate) btnRotate.addEventListener('click', () => sendCommand('rotate'));
        if (btnDrop) btnDrop.addEventListener('click', () => sendCommand('drop'));
    </script>
</body>
</html>
